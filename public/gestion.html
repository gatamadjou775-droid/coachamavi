<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E2230">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/icon-192.png" type="image/png">
<title>Espace coach</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/admin.css">
<style>
/* Tableau de bord */
.agenda .day{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--or3);margin:14px 0 6px;}
.agenda .day:first-child{margin-top:0;}
.it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--gris);margin-bottom:6px;cursor:pointer;}
.it:hover{background:var(--orp2);}
.it .hr{font-family:var(--fd);font-weight:700;font-size:24px;min-width:62px;}
.it .tx{flex:1;min-width:0;}
.it .tx b{display:block;}
.it .tx small{display:block;color:var(--gris4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Rendez-vous */
.f-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.rv-msg{background:var(--gris);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px;white-space:pre-wrap;max-width:420px;}
.acts{display:flex;gap:6px;flex-wrap:wrap;}
.wa{color:#1F9D55;font-weight:700;text-decoration:none;font-size:12.5px;}
.slots{display:flex;flex-wrap:wrap;gap:6px;}
.slots button{padding:8px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--gris2);font-weight:700;}
.slots button.on{background:var(--nuit);color:#fff;border-color:var(--nuit);}
.slots button:disabled{opacity:.35;text-decoration:line-through;}
/* Discussions */
.chatw{display:grid;grid-template-columns:320px 1fr;gap:14px;height:calc(100vh - 250px);min-height:460px;}
@media(max-width:820px){.chatw{grid-template-columns:1fr;height:auto;}}
.convs{background:#fff;border-radius:20px;overflow-y:auto;}
.cv-f{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--gris);flex-wrap:wrap;position:sticky;top:0;background:#fff;z-index:1;}
.cv-f button{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--gris4);}
.cv-f button.on{background:var(--nuit);color:#fff;}
.conv{padding:13px 14px;border-bottom:1px solid var(--gris);cursor:pointer;display:flex;gap:10px;align-items:center;}
.conv:hover{background:#FDFBF7;}
.conv.on{background:var(--orp2);}
.conv .av{width:42px;height:42px;border-radius:50%;background:var(--nuit);color:var(--or2);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.conv .ci{flex:1;min-width:0;}
.conv .ci b{display:block;}
.conv .ci small{display:block;color:var(--gris4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv .tg{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--or3);}
.thread{background:#fff;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-height:460px;}
.thread-h{padding:12px 18px;border-bottom:1px solid var(--gris);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.thread-h b{font-size:16px;}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--creme);}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;}
.msg.cl{align-self:flex-start;background:#fff;box-shadow:0 1px 0 var(--gris2);border-bottom-left-radius:5px;}
.msg.re{align-self:flex-end;background:var(--nuit);color:#fff;border-bottom-right-radius:5px;}
.msg.auto{background:var(--orp2);color:var(--noir);}
.msg .au{display:block;font-size:11.5px;font-weight:800;color:var(--or2);margin-bottom:2px;}
.msg.cl .au{color:var(--or3);}
.msg time{display:block;font-size:11px;opacity:.6;margin-top:3px;}
.thread-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--gris);align-items:flex-end;}
.thread-f textarea{flex:1;padding:12px 16px;border-radius:22px;border:1.5px solid var(--gris2);outline:none;resize:none;max-height:140px;line-height:1.4;}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px;}
.quick button{padding:5px 10px;border-radius:999px;background:var(--orp2);font-size:12px;font-weight:700;color:var(--or3);}
/* Listes de contenus */
.lst .li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--gris);}
.lst .li:last-child{border-bottom:none;}
.lst .li.off{opacity:.5;}
.lst .li .tx{flex:1;min-width:0;}
.lst .li .tx b{display:block;font-size:15px;}
.lst .li .tx small{display:block;color:var(--gris4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sw-l{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;}
.colpick{display:flex;gap:8px;}
.colpick button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--gris2);}
.colpick button.on{border-color:var(--or);}
/* Bannières */
.bans{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
.ban{height:170px;border-radius:18px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;padding:18px;}
.ban.nuit{background:radial-gradient(circle at 80% 45%,#1E5468,#0B1C28 75%);}
.ban.bleu{background:radial-gradient(circle at 80% 40%,#2A7189,#0F3546 85%);}
.ban.or{background:radial-gradient(circle at 78% 45%,#FFFBF1,#E6D5B2);color:var(--nuit);}
.ban img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ban.has-img::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,34,48,.92),rgba(14,34,48,.25));}
.ban .lau{position:absolute;right:-10px;top:50%;transform:translateY(-50%);height:88%;}
.ban .bt{position:relative;z-index:2;max-width:68%;}
.ban .bt small{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--or2);}
.ban.or .bt small{color:var(--or3);}
.ban .bt .h{font-size:25px;margin-top:4px;}
.ban .bt .h em{color:var(--or2);}
.ban.or .bt .h em{color:var(--or3);}
.ban .bt p{font-size:12.5px;line-height:1.35;margin-top:5px;opacity:.85;}
.ban-c{background:#fff;border-radius:22px;padding:10px;}
.ban-c.off .ban{opacity:.45;filter:grayscale(.6);}
.ban-a{display:flex;align-items:center;gap:8px;padding:10px 4px 2px;flex-wrap:wrap;}
/* Messages */
.days{display:flex;gap:5px;flex-wrap:wrap;}
.days button{width:36px;height:36px;border-radius:50%;background:var(--gris);font-weight:800;font-size:13px;}
.days button.on{background:var(--nuit);color:#fff;}
.prog{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--gris);flex-wrap:wrap;}
.prog:last-child{border-bottom:none;}
.prog .hr{font-family:var(--fd);font-weight:700;font-size:36px;min-width:90px;}
.prog .tx{flex:1;min-width:220px;}
.prog .tx b{display:block;}
.prog .tx p{color:var(--gris4);font-size:13.5px;margin-top:2px;}
.ins{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px;}
.ins button{padding:5px 10px;border-radius:8px;background:var(--orp);font-size:12px;font-weight:700;}
/* Devis */
.devis{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
.dv .k{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;border-bottom:1px solid var(--gris);}
.dv .k span{color:var(--gris4);}
.dv .k b{text-align:right;}
.dv .desc{background:var(--gris);border-radius:12px;padding:10px;font-size:13.5px;margin:10px 0;white-space:pre-wrap;}
/* Chips éditables */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 8px 7px 13px;border-radius:999px;background:var(--gris);font-weight:700;font-size:13px;}
.chip button{width:22px;height:22px;border-radius:50%;background:#fff;font-weight:800;font-size:12px;}
.soc-i{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px;}
.qr-c{text-align:center;background:#fff;border:2px solid var(--nuit);border-radius:22px;padding:20px;max-width:340px;}
.qr-c svg{width:220px;height:220px;margin:10px auto;display:block;}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><img src="/img/logo-mc.png" alt=""></div>
  <div class="brand"><div class="h" id="g-nom">Espace coach</div><small><span id="g-me"></span> · <span class="live" id="live"><i></i><span>connexion…</span></span></small></div>
  <div class="tb-r">
    <button class="dispo on" id="g-dispo" onclick="toggleDispo()" title="Les visiteurs voient si vous êtes disponible pour discuter"><i></i><span>Disponible</span></button>
    <a class="tb-btn" href="/" target="_blank">Voir le site</a>
    <button class="tb-btn" onclick="logout()">Déconnexion</button>
  </div>
</header>
<nav class="nav" id="nav"></nav>
<main class="content" id="content"></main>

<script src="/vendor/qrcode.js"></script>
<script src="/admin-commun.js"></script>
<script>
let G = null, P = 'accueil', ME = null;
const isCoach = () => ME && ME.role === 'coach';
const byId = (arr, id) => arr.find(x => x.id === Number(id));
const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); };
const JOURS = [[1, 'L'], [2, 'M'], [3, 'M'], [4, 'J'], [5, 'V'], [6, 'S'], [0, 'D']];
const PAYS = ['Espèces', 'Wave', 'Orange Money', 'MTN MoMo', 'Moov Money', 'Virement', 'Offert'];
const waLink = t => t ? `https://wa.me/${String(t).replace(/\D/g, '')}` : '';
const telLink = t => `<a href="tel:${esc(t)}">${esc(t)}</a>${t ? ` · <a class="wa" href="${waLink(t)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}`;
let audioCtx = null;

const PANELS = [
  ['accueil', 'Tableau de bord'], ['rdv', 'Rendez-vous', 'n-rdv'], ['discussions', 'Discussions', 'n-chat'], ['devis', 'Devis formations', 'n-devis'],
  ['ateliers', 'Ateliers', 'n-at'], ['personnes', 'Personnes accompagnées'], ['messages', 'Messages & pensées'], '|',
  ['coach', 'Le coach', null, true], ['contacts', 'Contacts & réseaux', null, true], ['agenda', 'Agenda & horaires', null, true],
  ['themes', 'Accompagnements'], ['bannieres', 'Bannière défilante'], ['temoignages', 'Témoignages', 'n-tem'], ['ressources', 'Ressources'], ['faq', 'FAQ', null, true], '|',
  ['equipe', 'Équipe', null, true], ['compte', 'Mon compte']
];

// ===================================================================
// DÉMARRAGE
// ===================================================================
function buildNav() {
  $('nav').innerHTML = PANELS.filter(p => p === '|' || !p[3] || isCoach()).map(p => p === '|' ? '<span class="sep"></span>' : `<button class="nb" data-p="${p[0]}">${p[1]}${p[2] ? ` <span class="cnt" id="${p[2]}"></span>` : ''}</button>`).join('');
  $('content').innerHTML = PANELS.filter(p => p !== '|').map(p => `<section class="panel" id="p-${p[0]}"></section>`).join('');
  document.querySelectorAll('#nav .nb').forEach(b => b.onclick = () => showPanel(b.dataset.p));
}
function showPanel(p) {
  if (!$('p-' + p) || !document.querySelector(`#nav [data-p="${p}"]`)) p = 'accueil';
  P = p;
  document.querySelectorAll('#nav .nb').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  document.querySelectorAll('.panel').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  render(); window.scrollTo(0, 0);
  try { localStorage.setItem('c_panel', p); } catch (e) { }
}
async function load() {
  G = await api('/api/admin/bootstrap');
  ME = G.me;
  $('g-nom').textContent = G.coach.nom;
  $('g-me').textContent = ME.nom + (isCoach() ? ' · coach' : ' · assistant(e)');
  renderDispo();
}
adminBoot(async () => {
  await load();
  buildNav();
  let p = 'accueil'; try { p = localStorage.getItem('c_panel') || p; } catch (e) { }
  showPanel(p);
  adminStream({
    rdv: r => { const isNew = !G.rdvs.some(x => x.id === r.id); const old = byId(G.rdvs, r.id); const prev = old && old.statut; upsert(G.rdvs, r);
      if (isNew && r.statut === 'demande') alerte('Nouvelle demande de rendez-vous', `${r.nom} · ${dLong(r.date)} à ${r.heure}`);
      else if (prev && prev !== r.statut && r.annulePar === 'client' && r.statut === 'annule') alerte('Rendez-vous annulé par la personne', `${r.nom} · ${dLong(r.date)} à ${r.heure}`);
      else if (prev === 'propose' && r.statut === 'confirme') alerte('Nouvel horaire accepté', `${r.nom} · ${dLong(r.date)} à ${r.heure}`);
      refresh(['rdv', 'accueil', 'personnes']); },
    devis: d => { const isNew = !G.devis.some(x => x.id === d.id); const old = byId(G.devis, d.id); const prev = old && old.statut; upsert(G.devis, d);
      if (isNew) alerte('Nouvelle demande de devis', `${d.nom} · ${d.theme} · ${d.participants} pers.`);
      else if (prev !== d.statut && (d.statut === 'accepte' || d.statut === 'refuse')) alerte('Devis ' + (d.statut === 'accepte' ? 'accepté' : 'refusé'), d.nom + ' · ' + d.theme);
      refresh(['devis', 'accueil']); },
    chat: m => { const c = Object.assign({}, m); delete c.clientNom; delete c.clientTel; delete c.invite; upsert(G.chats, c);
      if (!G.clients.some(x => x.id === m.clientId)) G.clients.push({ id: m.clientId, nom: m.clientNom, tel: m.clientTel, invite: m.invite, createdAt: m.at });
      if (m.de === 'client' && !(P === 'discussions' && CUR === m.clientId && !document.hidden)) alerte('Message de ' + m.clientNom, m.texte, 1);
      if (P === 'discussions') renderDiscussions(true); else refresh(['accueil']); badges(); },
    chatLu: d => { G.chats.forEach(x => { if (x.clientId === d.clientId && x.de === 'client') x.lu = true; }); badges(); if (P === 'discussions') renderDiscussions(true); },
    client: c => { upsert(G.clients, c); refresh(['personnes']); },
    clientSupprime: d => { G.clients = G.clients.filter(c => c.id !== d.id); G.chats = G.chats.filter(m => m.clientId !== d.id); refresh(['personnes', 'discussions']); },
    inscription: i => { const isNew = !G.inscriptions.some(x => x.id === i.id); upsert(G.inscriptions, i); if (isNew) alerte('Nouvelle inscription à un atelier', `${i.nom} · ${i.titre} · ${i.places} place(s)`); refresh(['ateliers', 'accueil']); },
    temoignage: t => { upsert(G.temoignages, t); alerte('Nouveau témoignage à relire', t.nom + ' : ' + t.texte.slice(0, 80)); refresh(['temoignages', 'accueil']); },
    presence: p => { G.presence = p; if (P === 'equipe' || P === 'accueil') render(); }
  }, on => { $('live').classList.toggle('on', on); $('live').querySelector('span').textContent = on ? 'en direct' : 'reconnexion…'; if (on && G) load().then(() => render()); });
});
function refresh(list) { if (list.includes(P)) render(); badges(); }
function render() {
  if (!G) return;
  const fn = { accueil: rAccueil, rdv: rRdv, discussions: renderDiscussions, devis: rDevis, ateliers: rAteliers, personnes: rPersonnes, messages: rMessages,
    coach: rCoach, contacts: rContacts, agenda: rAgenda, themes: rThemes, bannieres: rBanners, temoignages: rTem, ressources: rRess, faq: rFaq, equipe: rEquipe, compte: rCompte }[P];
  if (fn) fn();
  badges();
}
function badges() {
  const set = (id, n) => { const el = $(id); if (el) el.textContent = n || ''; };
  const nr = G.rdvs.filter(r => r.statut === 'demande').length;
  const nc = G.chats.filter(m => m.de === 'client' && !m.lu).length;
  set('n-rdv', nr); set('n-chat', nc);
  set('n-devis', G.devis.filter(d => d.statut === 'nouveau').length);
  set('n-at', G.inscriptions.filter(i => i.statut === 'inscrit').length);
  set('n-tem', G.temoignages.filter(t => !t.publie && t.source === 'site').length);
  const tot = nr + nc;
  document.title = (tot ? `(${tot}) ` : '') + 'Espace coach — ' + G.coach.nom;
}
function ding(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 1 ? [659, 988] : [784, 1046, 1318];
    notes.forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); const t = audioCtx.currentTime + i * .16; o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .42); });
  } catch (e) { }
}
document.addEventListener('click', () => { if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }, { once: true });
function alerte(t, b, kind) {
  ding(kind); toast(t, b);
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) { try { new Notification(t, { body: b, icon: '/img/icon-192.png' }); } catch (e) { } }
}
function renderDispo() { const on = G.coach.disponible !== false, b = $('g-dispo'); b.className = 'dispo ' + (on ? 'on' : 'off'); b.querySelector('span').textContent = on ? 'Disponible pour discuter' : 'Indisponible'; }
async function toggleDispo() { try { const r = await api('/api/admin/coach', { method: 'PUT', body: { disponible: G.coach.disponible === false } }); G.coach = r.coach; renderDispo(); toast(G.coach.disponible ? 'Vous apparaissez disponible' : 'Vous apparaissez indisponible', 'Les visiteurs le voient en direct sur le site.'); } catch (e) { toast('Erreur', e.message, true); } }
const nomTheme = id => (byId(G.themes, id) || {}).nom || '';
const clientOf = id => byId(G.clients, id) || { nom: 'Personne', tel: '' };
async function pickImg(input, prevId, set, max) {
  const f = input.files[0]; if (!f) return;
  const pv = $(prevId); if (pv) pv.style.opacity = .4;
  try { const url = await uploadImage(f, max); set(url); if (pv) pv.style.backgroundImage = `url('${url}')`; } catch (e) { toast('Image', e.message, true); }
  if (pv) pv.style.opacity = 1;
}

// ===================================================================
// TABLEAU DE BORD
// ===================================================================
function encaisseMois() {
  const m = todayStr().slice(0, 7);
  let t = 0;
  G.rdvs.forEach(r => { if (r.paiement && r.paiement.montant && (r.paiement.at || '').slice(0, 7) === m) t += r.paiement.montant; });
  G.devis.forEach(d => { if (d.statut === 'termine' && (d.termineAt || '').slice(0, 7) === m) t += d.montant || 0; });
  G.inscriptions.forEach(i => { if (i.montant && (i.at || '').slice(0, 7) === m && i.statut !== 'annulee') t += i.montant; });
  return t;
}
function rAccueil() {
  const td = todayStr();
  const auj = G.rdvs.filter(r => r.date === td && ['confirme', 'honore'].includes(r.statut));
  const aTraiter = G.rdvs.filter(r => r.statut === 'demande').length + G.devis.filter(d => d.statut === 'nouveau').length + G.inscriptions.filter(i => i.statut === 'inscrit').length + G.temoignages.filter(t => !t.publie && t.source === 'site').length;
  const nonLus = G.chats.filter(m => m.de === 'client' && !m.lu).length;
  const semaine = G.rdvs.filter(r => ['confirme', 'demande', 'propose'].includes(r.statut) && r.date >= td && r.date <= addDays(td, 7)).sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure));
  const byDay = {}; semaine.forEach(r => (byDay[r.date] = byDay[r.date] || []).push(r));
  const todo = [].concat(
    G.rdvs.filter(r => r.statut === 'demande').map(r => ({ at: r.at, t: 'Rendez-vous demandé', s: `${r.nom} · ${dLong(r.date)} ${r.heure}`, go: `showPanel('rdv')` })),
    G.devis.filter(d => d.statut === 'nouveau').map(d => ({ at: d.at, t: 'Demande de devis', s: `${d.nom} · ${d.theme}`, go: `showPanel('devis')` })),
    G.inscriptions.filter(i => i.statut === 'inscrit').map(i => ({ at: i.at, t: 'Inscription atelier', s: `${i.nom} · ${i.titre}`, go: `showPanel('ateliers')` })),
    G.temoignages.filter(t => !t.publie && t.source === 'site').map(t => ({ at: t.at, t: 'Témoignage à relire', s: t.nom, go: `showPanel('temoignages')` }))
  ).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 8);
  const convs = {}; G.chats.forEach(m => { (convs[m.clientId] = convs[m.clientId] || []).push(m); });
  const recent = Object.keys(convs).map(Number).map(id => ({ id, last: convs[id][convs[id].length - 1], un: convs[id].filter(m => m.de === 'client' && !m.lu).length })).sort((a, b) => b.last.at.localeCompare(a.last.at)).slice(0, 6);
  const p = G.presence || { enLigne: [] };
  $('p-accueil').innerHTML = `<div class="ph-t"><div><div class="h">Bonjour ${esc(ME.nom.split(' ')[0])}</div><p>${esc(dLong(td))} · ${p.enLigne && p.enLigne.length ? 'En ligne : ' + p.enLigne.map(u => esc(u.nom)).join(', ') : ''}</p></div>

    <div class="kpis"><div class="kpi nuit" onclick="RF='jour';showPanel('rdv')"><div class="l">Rendez-vous aujourd’hui</div><div class="v">${auj.length}</div><div class="s">${auj.map(r => r.heure).join(' · ') || 'Aucun'}</div></div>

      <div class="card"><div class="card-t">À traiter</div>${todo.length ? todo.map(x => `<div class="it" onclick="${x.go}"><span class="tx"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span><span class="hint">${fdt(x.at)}</span></div>`).join('') : '<div class="empty">Tout est à jour. 🌿</div>'}</div>

let RF = 'traiter';
const RDV_B = { demande: '<span class="badge or">À confirmer</span>', confirme: '<span class="badge vert">Confirmé</span>', propose: '<span class="badge bleu">Horaire proposé</span>', refuse: '<span class="badge rouge">Refusé</span>', annule: '<span class="badge">Annulé</span>', honore: '<span class="badge nuit">Effectué</span>', absent: '<span class="badge rouge">Absent</span>' };
function rdvFilters() {

  return { traiter: r => ['demande', 'propose'].includes(r.statut), jour: r => r.date === td && ['confirme', 'honore', 'absent'].includes(r.statut), venir: r => r.statut === 'confirme' && r.date >= td, passes: r => r.date < td && ['confirme', 'honore', 'absent'].includes(r.statut), tous: () => true };
}
function rRdv() {
  const f = rdvFilters();
  const list = G.rdvs.filter(f[RF]).sort((a, b) => RF === 'passes' || RF === 'tous' ? (b.date + b.heure).localeCompare(a.date + a.heure) : (a.date + a.heure).localeCompare(b.date + b.heure));

    <div class="f-tabs">${[['traiter', 'À traiter'], ['jour', 'Aujourd’hui'], ['venir', 'À venir'], ['passes', 'Passés'], ['tous', 'Tous']].map(([k, l]) => `<button class="nb ${RF === k ? 'on' : ''}" onclick="RF='${k}';render()">${l} (${cnt(k)})</button>`).join('')}</div>
    <div class="card">${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Personne</th><th>Sujet & format</th><th>Statut</th><th></th></tr></thead><tbody>
      ${list.map(r => `<tr><td style="white-space:nowrap"><b>${esc(dLong(r.date))}</b><br><span class="h" style="font-size:24px">${esc(r.heure)}</span>${r.proposition ? `<div class="hint">→ proposé : ${dmy(r.proposition.date)} ${esc(r.proposition.heure)}</div>` : ''}</td>
        <td><b>${esc(r.nom)}</b>${r.premiere ? ' <span class="badge or">1re fois</span>' : ''}${r.source === 'coach' ? ' <span class="badge">saisi</span>' : ''}<br><span style="font-size:13px">${telLink(r.tel)}</span></td>
        <td><b>${esc(r.theme)}</b><div class="hint">${esc(r.format)}</div>${r.message ? `<div class="rv-msg">${esc(r.message)}</div>` : ''}${r.infos ? `<div class="hint" style="margin-top:4px"><b>Infos envoyées :</b> ${esc(r.infos)}</div>` : ''}${r.paiement && r.paiement.montant ? `<div class="hint"><b>Réglé :</b> ${F(r.paiement.montant)} · ${esc(r.paiement.mode)}</div>` : ''}${isCoach() && r.notePrivee ? `<div class="hint" style="margin-top:4px">🔒 ${esc(r.notePrivee.slice(0, 90))}${r.notePrivee.length > 90 ? '…' : ''}</div>` : ''}</td>
        <td>${RDV_B[r.statut] || ''}</td>
        <td><div class="acts">${rdvActions(r)}</div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Aucun rendez-vous ici.</div>'}</div>`;
}
function rdvActions(r) {
  const a = [];
  if (r.statut === 'demande') a.push(`<button class="btn vert sm" onclick="confirmerRdv(${r.id})">Confirmer</button>`, `<button class="btn ghost sm" onclick="proposerRdv(${r.id})">Autre horaire</button>`, `<button class="btn line sm" onclick="statutRdv(${r.id},'refuse')">Refuser</button>`);
  if (r.statut === 'propose') a.push(`<button class="btn line sm" onclick="statutRdv(${r.id},'annule')">Annuler</button>`);
  if (r.statut === 'confirme') a.push(`<button class="btn nuit sm" onclick="honorerRdv(${r.id})">Effectué</button>`, `<button class="btn ghost sm" onclick="statutRdv(${r.id},'absent')">Absent</button>`, `<button class="btn ghost sm" onclick="proposerRdv(${r.id})">Déplacer</button>`, `<button class="btn line sm" onclick="statutRdv(${r.id},'annule')">Annuler</button>`);
  if (r.statut === 'honore') a.push(`<button class="btn ghost sm" onclick="honorerRdv(${r.id},true)">Paiement</button>`);
  if (r.clientId) a.push(`<button class="btn line sm" onclick="showPanel('discussions');openConv(${r.clientId})">Écrire</button>`);
  if (isCoach()) a.push(`<button class="btn line sm" onclick="noteRdv(${r.id})" title="Note privée (visible par le coach uniquement)">🔒 Note</button>`);
  return a.join('');
}
function confirmerRdv(id) {
  const r = byId(G.rdvs, id); const c = G.coach;
  const def = /visio|ligne/i.test(r.format) ? 'Le lien de la visio vous sera envoyé ici, dans la discussion, avant la séance.' : /t[ée]l[ée]phone|whatsapp/i.test(r.format) ? `Le coach vous appellera au ${r.tel || 'numéro indiqué'} à l’heure du rendez-vous.` : (c.adresse ? 'Adresse : ' + c.adresse : '');

    <div class="row" style="margin-top:14px"><div class="fld"><label>Montant réglé (F CFA)</label><input type="number" id="hp-m" value="${p.montant || ''}" placeholder="0 si offert"></div>
      <div class="fld"><label>Mode</label><select id="hp-p">${PAYS.map(x => `<option ${p.mode === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
    <div class="mfoot"><button class="btn nuit big" onclick="${edit ? `savePaiement(${id})` : `statutRdv(${id},'honore',{paiement:{montant:$('hp-m').value,mode:$('hp-p').value}})`}">Enregistrer</button></div>`);
}
async function savePaiement(id) { try { const r = await api(`/api/admin/rdv/${id}/paiement`, { method: 'PUT', body: { montant: $('hp-m').value, mode: $('hp-p').value } }); upsert(G.rdvs, r.rdv); closeModal(); render(); } catch (e) { toast('Erreur', e.message, true); } }
async function statutRdv(id, st, extra) {
  const body = Object.assign({ statut: st }, extra || {});
  if ((st === 'refuse' || st === 'annule') && body.reponse === undefined) { const m = prompt('Message à la personne (facultatif) :', st === 'refuse' ? 'Je ne suis pas disponible à ce moment-là. N’hésitez pas à choisir un autre créneau.' : 'Je dois malheureusement annuler ce rendez-vous. Choisissons un autre moment.'); if (m === null) return; body.reponse = m; }
  try { const r = await api('/api/admin/rdv/' + id, { body }); upsert(G.rdvs, r.rdv); closeModal(); render(); toast('Rendez-vous mis à jour', r.rdv.clientId ? 'La personne est prévenue.' : ''); }
  catch (e) { const el = $('pp-e'); if (el) el.textContent = e.message; else toast('Erreur', e.message, true); }

function noteRdv(id) {
  const r = byId(G.rdvs, id);
  openModal(`<div class="mt h">Note privée</div><p class="hint">${esc(r.nom)} · ${esc(dLong(r.date))}. Visible uniquement par le coach, jamais par la personne ni les assistant(e)s.</p>
    <div class="fld" style="margin-top:12px"><textarea id="nt" rows="9">${esc(r.notePrivee || '')}</textarea></div>

}
async function saveNote(id) { try { const r = await api(`/api/admin/rdv/${id}/note`, { method: 'PUT', body: { notePrivee: $('nt').value } }); upsert(G.rdvs, r.rdv); closeModal(); render(); } catch (e) { toast('Erreur', e.message, true); } }
function editRdvManuel(clientId) {

  openModal(`<div class="mt h">Ajouter un rendez-vous</div><p class="hint">Pour un rendez-vous pris par téléphone ou WhatsApp. Si la personne a un espace sur le site (même numéro), elle est prévenue.</p>
    <div class="row" style="margin-top:12px"><div class="fld"><label>Nom</label><input id="rm-n" value="${esc(c ? c.nom : '')}"></div><div class="fld"><label>Téléphone</label><input id="rm-t" value="${esc(c ? c.tel : '')}"></div></div>
    <div class="row"><div class="fld"><label>Sujet</label><select id="rm-th"><option value="0">Séance</option>${G.themes.map(t => `<option value="${t.id}">${esc(t.nom)}</option>`).join('')}</select></div>
      <div class="fld"><label>Format</label><select id="rm-f">${G.coach.rdv.formats.map(f => `<option>${esc(f)}</option>`).join('')}</select></div></div>
    <div class="row"><div class="fld"><label>Date</label><input type="date" id="rm-d" value="${todayStr()}"></div><div class="fld"><label>Heure</label><input type="time" id="rm-h" value="${G.coach.rdv.creneaux[0] || '09:00'}"></div></div>
    <div class="fld"><label>Infos / notes</label><input id="rm-i" placeholder="Facultatif"></div>

let CUR = null, CF = 'toutes';
function renderDiscussions(keep) {
  const convs = {};
  G.chats.forEach(m => { (convs[m.clientId] = convs[m.clientId] || []).push(m); });
  let ids = Object.keys(convs).map(Number).sort((a, b) => { const la = convs[a][convs[a].length - 1], lb = convs[b][convs[b].length - 1]; return lb.at.localeCompare(la.at); });
  const lastCible = id => { const ms = convs[id].filter(m => m.de === 'client'); return ms.length ? ms[ms.length - 1].cible : ''; };
  const filt = { toutes: () => true, nonlues: id => convs[id].some(m => m.de === 'client' && !m.lu), coach: id => lastCible(id) === 'coach', equipe: id => lastCible(id) === 'equipe' }[CF];
  ids = ids.filter(filt);
  if (CUR && !convs[CUR]) convs[CUR] = [];
  if (!CUR && ids.length) CUR = ids[0];
  const list = CUR && !ids.includes(CUR) ? [CUR].concat(ids) : ids;
  const thread = CUR ? (convs[CUR] || []) : [];
  const c = CUR ? clientOf(CUR) : null;
  const input = $('th-in'); const draft = input ? input.value : ''; const hadFocus = input && document.activeElement === input;
  const nRdv = CUR ? G.rdvs.filter(r => r.clientId === CUR).length : 0;
  const quick = ['Bonjour, merci pour votre message. Je suis là pour vous écouter.', 'Souhaitez-vous que nous fixions un rendez-vous ?', `Vous pouvez choisir un créneau directement sur le site, rubrique « Prendre rendez-vous ».`, 'Prenez soin de vous. Je reviens vers vous très vite.'];
  $('p-discussions').innerHTML = `<div class="ph-t"><div><div class="h">Discussions</div><p>Messages reçus depuis le site. La personne reçoit votre réponse en direct et en notification. Votre nom s’affiche au-dessus de vos messages.</p></div></div>
    <div class="chatw"><div class="convs"><div class="cv-f">${[['toutes', 'Toutes'], ['nonlues', 'Non lues'], ['coach', 'Pour le coach'], ['equipe', 'Pour l’équipe']].map(([k, l]) => `<button class="${CF === k ? 'on' : ''}" onclick="CF='${k}';CUR=null;renderDiscussions()">${l}</button>`).join('')}</div>
      ${list.length ? list.map(id => { const ms = convs[id] || []; const last = ms[ms.length - 1]; const un = ms.filter(m => m.de === 'client' && !m.lu).length; const cl = clientOf(id); const cb = lastCible(id);
        return `<div class="conv ${id === CUR ? 'on' : ''}" onclick="openConv(${id})"><div class="av">${esc((cl.nom || '?')[0].toUpperCase())}</div><div class="ci"><b>${esc(cl.nom)}${cl.invite ? ' <span class="badge" style="font-size:10px;padding:2px 6px">visiteur</span>' : ''}</b>${cb ? `<span class="tg">→ ${cb === 'coach' ? 'le coach' : 'l’équipe'}</span>` : ''}<small>${last ? esc((last.de === 'client' ? '' : (last.auteur || 'Vous') + ' : ') + last.texte) : 'Nouvelle discussion'}</small></div>${un ? `<span class="cnt">${un}</span>` : ''}</div>`; }).join('') : '<div class="empty">Aucune discussion.</div>'}</div>
    <div class="thread">${CUR ? `<div class="thread-h"><span><b>${esc(c.nom)}</b> ${c.tel ? `· ${telLink(c.tel)}` : '<span class="hint">· pas de numéro</span>'}</span><span class="row" style="gap:6px"><span class="badge">${nRdv} rendez-vous</span><button class="btn ghost sm" onclick="fichePersonne(${CUR})">Fiche</button><button class="btn sm" onclick="editRdvManuel(${CUR})">+ RDV</button></span></div>
      <div class="msgs" id="msgs">${thread.map(m => `<div class="msg ${m.de === 'client' ? 'cl' : 're'} ${m.auto ? 'auto' : ''}">${m.de === 'client' ? (m.cible ? `<span class="au">pour ${m.cible === 'coach' ? 'le coach' : 'l’équipe'}</span>` : '') : `<span class="au">${esc(m.auto ? 'Réponse automatique' : m.auteur || '')}</span>`}${esc(m.texte)}<time>${fdt(m.at)}</time></div>`).join('') || '<div class="empty">Écrivez le premier message.</div>'}</div>
      <div class="quick">${quick.map((q, i) => `<button onclick="$('th-in').value=${esc(JSON.stringify(q))};$('th-in').focus()">${['Accueil', 'Proposer un RDV', 'Lien RDV', 'À bientôt'][i]}</button>`).join('')}</div>
      <div class="thread-f"><textarea id="th-in" rows="1" placeholder="Votre réponse… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button class="btn" onclick="sendChat()">Envoyer</button></div>` : '<div class="empty" style="margin:auto">Sélectionnez une discussion.</div>'}</div></div>`;
  const ms = $('msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  const ni = $('th-in'); if (ni) { ni.value = draft; if (hadFocus || !keep) ni.focus(); }
  if (CUR && !document.hidden && thread.some(m => m.de === 'client' && !m.lu)) { thread.forEach(m => { if (m.de === 'client') m.lu = true; }); api(`/api/admin/chat/${CUR}/lu`, { body: {} }).catch(() => { }); badges(); }
}
function openConv(id) { CUR = id; CF = 'toutes'; const i = $('th-in'); if (i) i.value = ''; renderDiscussions(); }
async function sendChat() {
  const i = $('th-in'); const t = i.value.trim(); if (!t) return;
  try { const r = await api('/api/admin/chat/' + CUR, { body: { texte: t } }); i.value = ''; upsert(G.chats, r.message); renderDiscussions(); } catch (e) { toast('Erreur', e.message, true); }
}

async function saveItem(base, coll, obj, errId) {
  const body = Object.assign({}, obj); const id = body._id; delete body._id; delete body.id;
  try {
    const r = id ? await api(`/api/admin/${base}/${id}`, { method: 'PUT', body }) : await api(`/api/admin/${base}`, { body });
    upsert(G[coll], r.item); closeModal(); render(); toast('Enregistré', 'Visible tout de suite sur le site.');
  } catch (e) { const el = $(errId); if (el) el.textContent = e.message; else toast('Erreur', e.message, true); }
}
async function patchItem(base, coll, id, body) { try { const r = await api(`/api/admin/${base}/${id}`, { method: 'PUT', body }); upsert(G[coll], r.item); render(); } catch (e) { toast('Erreur', e.message, true); } }
async function delItem(base, coll, id) { if (!confirm('Supprimer définitivement ?')) return; try { await api(`/api/admin/${base}/${id}/delete`, { body: {} }); G[coll] = G[coll].filter(x => x.id !== id); closeModal(); render(); } catch (e) { toast('Impossible', e.message, true); } }
async function moveItem(base, coll, id, d) {
  const xs = G[coll].slice().sort((a, b) => a.ordre - b.ordre); const i = xs.findIndex(x => x.id === id), j = i + d; if (j < 0 || j >= xs.length) return;
  [xs[i], xs[j]] = [xs[j], xs[i]];
  for (let k = 0; k < xs.length; k++) if (xs[k].ordre !== k + 1) { const r = await api(`/api/admin/${base}/${xs[k].id}`, { method: 'PUT', body: { ordre: k + 1 } }); upsert(G[coll], r.item); }
  render();
}

      <div class="card"><div class="card-t">Réseaux sociaux</div><p class="hint" style="margin:-4px 0 12px">Collez le lien de chaque page. Laissez vide pour masquer l’icône sur le site.</p>
        <div class="soc-i">${RS.map(([k, l, ph]) => `<div class="fld"><label>${l}</label><input id="rs-${k}" value="${esc(c.reseaux[k] || '')}" placeholder="${esc(ph)}"></div>`).join('')}</div>
        <div class="mfoot"><button class="btn big" onclick="saveReseaux()">Enregistrer les liens</button></div></div></div>`;
}
function saveContacts() { const b = {}; ['tel', 'whatsapp', 'email', 'adresse', 'horaires'].forEach(k => b[k] = $('ct-' + k).value); saveCoach(b, 'Coordonnées enregistrées'); }
function saveReseaux() { const r = {}; RS.forEach(([k]) => r[k] = $('rs-' + k).value.trim()); saveCoach({ reseaux: r }, 'Liens enregistrés'); }
let AG = null;
function rAgenda() {
  const c = G.coach; AG = JSON.parse(JSON.stringify({ rdv: c.rdv, indisponibles: c.indisponibles || [] }));
  drawAgenda();
}
function drawAgenda() {
  const r = AG.rdv;
  $('p-agenda').innerHTML = `<div class="ph-t"><div><div class="h">Agenda & horaires</div><p>Les créneaux proposés en ligne pour la prise de rendez-vous. Un créneau déjà demandé ou confirmé n’est plus proposé.</p></div></div>
    <div class="grid2" style="align-items:start">
      <div class="card"><div class="card-t">Jours et créneaux</div>
        <div class="fld"><label>Jours de consultation</label><div class="days">${JOURS.map(([d, l]) => `<button class="${r.jours.includes(d) ? 'on' : ''}" onclick="AG.rdv.jours=AG.rdv.jours.includes(${d})?AG.rdv.jours.filter(x=>x!==${d}):AG.rdv.jours.concat(${d});drawAgenda()">${l}</button>`).join('')}</div></div>
        <div class="fld"><label>Heures de début des séances</label><div class="chips">${r.creneaux.map((h, i) => `<span class="chip">${h}<button onclick="AG.rdv.creneaux.splice(${i},1);drawAgenda()">×</button></span>`).join('')}</div>
          <div class="row" style="margin-top:8px"><input type="time" id="ag-h" value="18:30" style="padding:9px;border-radius:10px;border:1.5px solid var(--gris2)"><button class="btn ghost sm" onclick="const v=$('ag-h').value;if(v&&!AG.rdv.creneaux.includes(v)){AG.rdv.creneaux.push(v);AG.rdv.creneaux.sort();drawAgenda()}">+ Ajouter</button></div></div>
        <div class="row"><div class="fld"><label>Durée d’une séance (min)</label><input type="number" value="${r.duree}" oninput="AG.rdv.duree=Number(this.value)"></div>
          <div class="fld"><label>Délai minimum (heures)</label><input type="number" value="${r.delaiHeures}" oninput="AG.rdv.delaiHeures=Number(this.value)"></div>
          <div class="fld"><label>Réservable jusqu’à (jours)</label><input type="number" value="${r.horizonJours}" oninput="AG.rdv.horizonJours=Number(this.value)"></div></div></div>
      <div class="card"><div class="card-t">Formats & tarif</div>
        <div class="fld"><label>Formats proposés (un par ligne)</label><textarea rows="4" oninput="AG.rdv.formats=this.value.split('\\n').map(s=>s.trim()).filter(Boolean)">${esc(r.formats.join('\n'))}</textarea></div>
        <div class="fld"><label>Information tarif (affichée lors de la prise de RDV)</label><input value="${esc(r.tarif)}" oninput="AG.rdv.tarif=this.value"></div>
        <div class="card-t" style="margin-top:16px">Jours bloqués <span class="hint" style="font-family:var(--fb);font-size:12.5px">congés, déplacements…</span></div>
        <div class="chips">${AG.indisponibles.length ? AG.indisponibles.map((d, i) => `<span class="chip">${esc(dLong(d))}<button onclick="AG.indisponibles.splice(${i},1);drawAgenda()">×</button></span>`).join('') : '<span class="hint">Aucun jour bloqué.</span>'}</div>
        <div class="row" style="margin-top:8px"><input type="date" id="ag-d" min="${todayStr()}" style="padding:9px;border-radius:10px;border:1.5px solid var(--gris2)"><button class="btn ghost sm" onclick="const v=$('ag-d').value;if(v&&!AG.indisponibles.includes(v)){AG.indisponibles.push(v);AG.indisponibles.sort();drawAgenda()}">+ Bloquer ce jour</button></div></div></div>
    <div class="mfoot"><button class="btn big" onclick="saveCoach({rdv:AG.rdv,indisponibles:AG.indisponibles},'Agenda enregistré')">Enregistrer l’agenda</button></div>`;
}
let FQ = null;
function rFaq() { FQ = JSON.parse(JSON.stringify(G.coach.faq || [])); drawFaq(); }
function drawFaq() {
  $('p-faq').innerHTML = `<div class="ph-t"><div><div class="h">Questions fréquentes</div><p>Affichées en bas du site, juste avant le contact.</p></div><button class="btn ghost" onclick="FQ.push({q:'',r:''});drawFaq()">+ Question</button></div>
    <div class="card">${FQ.map((f, i) => `<div style="padding:12px 0;border-bottom:1px solid var(--gris)"><div class="row"><div class="fld" style="margin:0"><input value="${esc(f.q)}" oninput="FQ[${i}].q=this.value" placeholder="Question"></div><button class="xbtn" onclick="FQ.splice(${i},1);drawFaq()">×</button></div>
      <div class="fld" style="margin:8px 0 0"><textarea rows="2" oninput="FQ[${i}].r=this.value" placeholder="Réponse">${esc(f.r)}</textarea></div></div>`).join('') || '<div class="empty">Aucune question.</div>'}
      <div class="mfoot"><button class="btn big" onclick="saveCoach({faq:FQ},'FAQ enregistrée')">Enregistrer</button></div></div>`;
}

// ===================================================================
// ÉQUIPE & MON COMPTE
// ===================================================================
function rEquipe() {
  const online = new Set(((G.presence || {}).enLigne || []).map(u => u.nom));
  $('p-equipe').innerHTML = `<div class="ph-t"><div><div class="h">Équipe</div><p>Créez un accès pour chaque assistant(e). Les assistant(e)s répondent aux discussions, gèrent les rendez-vous, devis et ateliers, mais ne voient pas vos notes privées et ne modifient pas votre profil.</p></div></div>
    <div class="grid2" style="align-items:start">
      <div class="card"><div class="card-t">Membres</div><div class="lst">${G.users.map(u => `<div class="li ${u.actif ? '' : 'off'}"><div class="thumb" style="background:var(--nuit);color:var(--or2);font-weight:800;border-radius:50%">${esc(u.nom[0].toUpperCase())}</div>
        <div class="tx"><b>${esc(u.nom)} ${online.has(u.nom) ? '<span class="badge vert">en ligne</span>' : ''}</b><small>Identifiant : ${esc(u.username)} · ${u.role === 'coach' ? 'Coach (accès complet)' : 'Assistant(e)'}</small></div>
        ${u.id !== ME.id ? `<button class="sw ${u.actif ? 'on' : ''}" title="Accès actif" onclick="patchUser(${u.id},{actif:${!u.actif}})"></button>` : '<span class="badge">vous</span>'}
        <button class="btn line sm" onclick="editUser(${u.id})">Modifier</button></div>`).join('')}</div></div>
      <div class="card"><div class="card-t">Ajouter un(e) assistant(e)</div>
        <div class="fld"><label>Nom affiché dans la discussion</label><input id="nu-n" placeholder="Ex. : Marie"></div>
        <div class="row"><div class="fld"><label>Identifiant</label><input id="nu-u" autocomplete="off"></div><div class="fld"><label>Mot de passe</label><input id="nu-p" type="text" autocomplete="off"></div></div>
        <div class="fld"><label>Rôle</label><select id="nu-r"><option value="assistant">Assistant(e)</option><option value="coach">Coach (accès complet)</option></select></div>
        <div class="err" id="nu-e"></div><button class="btn big" onclick="addUser()">Créer l’accès</button>
        <p class="hint" style="margin-top:10px">Transmettez l’identifiant et le mot de passe à la personne. Elle se connecte sur cette même page.</p></div></div>`;
}
async function addUser() { try { const r = await api('/api/admin/users', { body: { nom: $('nu-n').value, username: $('nu-u').value, password: $('nu-p').value, role: $('nu-r').value } }); G.users.push(r.user); render(); toast('Accès créé', r.user.username); } catch (e) { $('nu-e').textContent = e.message; } }
async function patchUser(id, body) { try { const r = await api('/api/admin/users/' + id, { method: 'PUT', body }); upsert(G.users, r.user); closeModal(); render(); toast('Enregistré', ''); } catch (e) { toast('Erreur', e.message, true); } }
function editUser(id) {
  const u = byId(G.users, id);
  openModal(`<div class="mt h">${esc(u.nom)}</div><div class="fld"><label>Nom affiché</label><input id="eu-n" value="${esc(u.nom)}"></div>
    <div class="fld"><label>Rôle</label><select id="eu-r"><option value="assistant" ${u.role === 'assistant' ? 'selected' : ''}>Assistant(e)</option><option value="coach" ${u.role === 'coach' ? 'selected' : ''}>Coach (accès complet)</option></select></div>
    <div class="fld"><label>Nouveau mot de passe (laisser vide pour ne pas changer)</label><input id="eu-p" type="text" autocomplete="off"></div>
    <div class="mfoot"><button class="btn big" onclick="patchUser(${id},Object.assign({nom:$('eu-n').value,role:$('eu-r').value},$('eu-p').value?{password:$('eu-p').value}:{}))">Enregistrer</button></div>`);
}
function rCompte() {
  const url = (() => { try { return localStorage.getItem('c_base') || location.origin; } catch (e) { return location.origin; } })();
  let qr = ''; try { const q = qrcode(0, 'M'); q.addData(url + '/?rdv=1'); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { }
  $('p-compte').innerHTML = `<div class="ph-t"><div><div class="h">Mon compte</div><p>Connecté(e) en tant que ${esc(ME.nom)} (${esc(ME.username)}).</p></div></div>
    <div class="grid2" style="align-items:start">
      <div class="card"><div class="card-t">Identifiant et mot de passe</div>
        <div class="fld"><label>Mot de passe actuel</label><input id="sc-cur" type="password"></div>
        <div class="row"><div class="fld"><label>Nouvel identifiant</label><input id="sc-u" placeholder="${esc(ME.username)}"></div><div class="fld"><label>Nouveau mot de passe</label><input id="sc-p" type="password"></div></div>
        <div class="err" id="sc-err"></div><button class="btn nuit" onclick="saveSecu()">Mettre à jour</button></div>
      <div class="card"><div class="card-t">QR code « Prendre rendez-vous »</div><p class="hint">À imprimer sur vos cartes de visite, flyers et affiches d’ateliers : on scanne, on arrive directement sur la prise de rendez-vous.</p>
        <div class="row noprint" style="margin-top:10px"><div class="fld"><label>Adresse publique du site</label><input id="qr-u" value="${esc(url)}"></div><div class="fld" style="flex:0"><button class="btn ghost" onclick="try{localStorage.setItem('c_base',$('qr-u').value.trim().replace(/\\/+$/,''))}catch(e){};render()">Mettre à jour</button></div></div>
        ${/localhost|127\.0\.0\.1/.test(url) ? '<p class="hint" style="color:var(--rouge);font-weight:700">« localhost » ne fonctionne que sur cet ordinateur : indiquez l’adresse en ligne du site.</p>' : ''}
        <div class="qr-c">${qr}<b class="h" style="font-size:24px">Prendre rendez-vous</b><p class="hint">${esc(G.coach.nom)} · ${esc(G.coach.tel)}</p></div>
        <button class="btn" style="margin-top:12px" onclick="window.print()">Imprimer</button></div></div>`;
}
async function saveSecu() {
  try { const r = await api('/api/admin/securite', { body: { currentPassword: $('sc-cur').value, newUsername: $('sc-u').value, newPassword: $('sc-p').value } }); ME = r.user; render(); toast('Accès mis à jour', ''); }
  catch (e) { $('sc-err').textContent = e.message; }
}
</script>
</body>
</html>
